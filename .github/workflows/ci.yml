name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:                      # the Spring context test needs a real MongoDB
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        run: chmod +x mvnw && ./mvnw -B clean verify
      - name: Docker build
        run: docker build -t gestion-parking:${{ github.sha }} .
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.76.1

      - name: Trivy report (HIGH + CRITICAL)
        run: |
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --format table -o trivy.txt gestion-parking:${{ github.sha }}
          { echo '### Trivy report'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat trivy.txt
          # one annotation per vulnerability (visible on the run page)
          trivy image --skip-db-update --ignore-unfixed --severity HIGH,CRITICAL --format template \
            --template '{{range .}}{{range .Vulnerabilities}}::warning title={{.VulnerabilityID}} ({{.Severity}})::{{.PkgName}} {{.InstalledVersion}} -> fixed in {{.FixedVersion}}{{"\n"}}{{end}}{{end}}' gestion-parking:${{ github.sha }}

      - name: Trivy gate (fail on fixable CRITICAL)
        run: trivy image --skip-db-update --ignore-unfixed --severity CRITICAL --exit-code 1 gestion-parking:${{ github.sha }}
